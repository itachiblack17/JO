<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Full Stack Developer — Learning Hub</title>
  <link rel="stylesheet" href="styles.css" />
</head>
<body>

  <!-- ── Top Bar ── -->
  <header class="topbar">
    <button class="menu-btn" id="menuBtn" aria-label="Toggle sidebar">☰</button>
    <div class="logo">FullStackHub</div>
    <div class="topbar-center">
      <div class="progress-bar" role="progressbar" aria-label="Overall progress">
        <div class="progress-fill" id="progressFill"></div>
      </div>
      <span id="progressLabel">0 / 35 skills</span>
    </div>
    <button class="theme-btn" id="themeBtn" aria-label="Toggle dark mode">🌙</button>
  </header>

  <!-- ── Layout ── -->
  <div class="app-layout">

    <!-- Sidebar nav (populated by JS) -->
    <nav class="sidebar" id="sidebar" aria-label="Section navigation">
      <ul class="nav-list" id="navList"></ul>
    </nav>

    <!-- Main content (sections rendered by JS) -->
    <main class="main" id="main"></main>

  </div>

  <!-- ── Global modal for expanded demos ── -->
  <div class="modal-overlay hidden" id="modalOverlay" role="dialog" aria-modal="true" aria-label="Demo viewer">
    <div class="modal-box" id="modalBox">
      <button class="modal-close" id="modalClose" aria-label="Close">✕</button>
      <div class="modal-body" id="modalBody"></div>
    </div>
  </div>

  <script src="app.js"></script>
</body>
</html>
